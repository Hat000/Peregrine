[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "racer"
version = "0.1.0"
description = "AI Grand Prix autonomous drone race entry"
requires-python = ">=3.13,<3.14"  # 3.13 has stable PyTorch CUDA wheels; 3.14 nightly-only until torch 2.10
dependencies = [
    "pymavlink>=2.4.40",
    "opencv-python>=4.9",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# YOLO-pose corner detector: training (Adroit/Azure) AND runtime inference -> GateObservation.
# Heavy (pulls torch) and GPU-only, so it stays out of the core deps. Install on the GPU
# boxes: `pip install -e ".[detector]"`. CUDA torch wheels (cp313, cu12x) are installed
# out-of-band per platform; ultralytics will otherwise pull a CPU torch.
detector = ["ultralytics>=8.3.0", "albumentations>=1.4"]  # albumentations = L3 "chaos" dataset aug
# TensorRT gate-detector engine export + runtime (scripts/export_trt_engine.py; OPT-IN via a
# `*.engine` weights path). <11 pin: TRT 11 removed BuilderFlag.FP16 and breaks the ultralytics
# 8.4.x exporter. x86 CUDA boxes only -- Jetson (Orin) gets TensorRT from JetPack, NEVER pip.
# Live-verified on ShadowPC: tensorrt-cu12 10.16.1.11 + torch 2.12.0+cu126.
tensorrt = ["tensorrt-cu12>=10.0,<11; platform_machine == 'AMD64' or platform_machine == 'x86_64'"]
# Time-optimal speed profiling. The pure-numpy `racer.speed_profile` is the Windows-friendly
# DEFAULT; `toppra` is a Cython/C++ lib needing the Windows SDK to build (same pain class as
# acados), so it installs only off-Windows (Linux sim box / Adroit) as a drop-in robustness
# upgrade behind the same `time_optimal_profile` API.
planning = ["toppra>=0.6.0; platform_system != 'Windows'"]

[tool.hatch.build.targets.wheel]
packages = ["src/racer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
