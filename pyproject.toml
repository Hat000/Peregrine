[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "racer"
version = "0.1.0"
description = "AI Grand Prix autonomous drone race entry"
requires-python = ">=3.13,<3.14"  # 3.13 has stable PyTorch CUDA wheels; 3.14 nightly-only until torch 2.10
dependencies = [
    "pymavlink>=2.4.40",
    "opencv-python>=4.9",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/racer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
