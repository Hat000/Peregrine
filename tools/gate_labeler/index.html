<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VQ2 gate labeler</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c313a; --fg:#d7dce3; --dim:#8b93a1;
          --acc:#4db6ff; --ok:#5dd964; --warn:#ffb648; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font:13px/1.4 "Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #app { display:flex; height:100%; }

  /* sidebar: frame list + progress */
  #side { width:240px; min-width:240px; background:var(--panel); border-right:1px solid var(--line);
          display:flex; flex-direction:column; }
  #progress { padding:10px 12px; border-bottom:1px solid var(--line); font-weight:600; }
  #framelist { flex:1; overflow-y:auto; }
  .fitem { padding:4px 12px; cursor:pointer; white-space:nowrap; overflow:hidden;
           text-overflow:ellipsis; color:var(--dim); }
  .fitem:hover { background:#262b33; }
  .fitem.cur { background:#2b3442; color:var(--fg); }
  .fitem.done { color:var(--ok); }
  .fitem.done::before { content:"\2713 "; }
  .fitem.seeded { color:var(--acc); }                 /* pre-filled: a nudge, not four clicks */
  .fitem.seeded::before { content:"\25C6 "; }
  .fitem:not(.done):not(.seeded)::before { content:"\2022 "; opacity:.35; }

  /* main column */
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #toolbar { display:flex; align-items:center; gap:6px; padding:6px 10px;
             background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  button { background:#2b313b; color:var(--fg); border:1px solid var(--line); border-radius:4px;
           padding:4px 10px; cursor:pointer; font:inherit; }
  button:hover { background:#353d4a; }
  button.primary { background:#1f4e73; border-color:#2c6da0; }
  button.danger  { background:#5b2b2b; border-color:#7a3a3a; }
  #prompt { margin-left:auto; font-weight:700; color:var(--warn); }
  #prompt.done { color:var(--ok); }
  #canvaswrap { flex:1; position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }
  /* FIXED height and NO wrapping. When #areainfo filled up, this bar wrapped to two lines and
     shrank #canvaswrap by ~19 px -- but the canvas backing store is only re-sized on window
     resize, so the bottom of the canvas stopped being repainted and drawing streaked over it. */
  #status { padding:4px 10px; background:var(--panel); border-top:1px solid var(--line);
            color:var(--dim); display:flex; gap:16px; height:26px; flex:0 0 26px;
            align-items:center; white-space:nowrap; overflow:hidden; }
  #status > span { overflow:hidden; text-overflow:ellipsis; }
  #frameinfo { flex:0 1 auto; }
  #dirty { color:var(--warn); font-weight:700; flex:0 0 auto; }
  #areainfo { color:#9fc7e8; flex:1 1 auto; min-width:0; }
  #keyhints { flex:0 0 auto; margin-left:auto; }
  kbd { background:#2b313b; border:1px solid var(--line); border-radius:3px; padding:0 4px; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div id="progress">labeled 0 / 0</div>
    <div id="framelist"></div>
  </div>
  <div id="main">
    <div id="toolbar">
      <button id="bPrev" title="prev [A / Left]">&#8592; prev</button>
      <button id="bNext" title="next [D / Right]">next &#8594;</button>
      <button id="bSave" class="primary" title="save [S]">save</button>
      <button id="bSkip" title="skip (next without saving) [K]">skip</button>
      <button id="bNoGate" title="save EMPTY label = negative frame [N]">NO GATE (negative)</button>
      <button id="bAddGate" title="start clicking a new gate [G]">+ add gate</button>
      <button id="bDelGate" class="danger" title="delete selected gate [X / Del]">delete gate</button>
      <button id="bRecompute" title="re-derive outer corners of selected gate from its inner 4 [R]">recompute outer</button>
      <button id="bFit" title="fit view [0]">fit</button>
      <label style="display:flex;align-items:center;gap:4px;cursor:pointer"
             title="hide frames with no pre-fill — those need all 4 corners clicked from scratch">
        <input type="checkbox" id="cOnlyReady" checked> pre-filled only</label>
      <span id="prompt"></span>
    </div>
    <div id="canvaswrap"><canvas id="cv"></canvas></div>
    <div id="status">
      <span id="frameinfo"></span><span id="dirty"></span><span id="areainfo"></span>
      <span id="keyhints">
        wheel=zoom &middot; <kbd>Space</kbd>=pan &middot; <kbd>O</kbd>=occluded &middot;
        <kbd>M</kbd>=area &middot; <kbd>L</kbd>=guides &middot; <kbd>Z</kbd>=undo &middot;
        <kbd>Esc</kbd>=cancel
      </span>
    </div>
  </div>
</div>

<script>
"use strict";
/* ==========================================================================================
   VQ2 gate hand-labeler frontend.

   WHAT YOU ARE LABELLING IS THE AREA. Each gate is two quads -- the 2.72 m outer square
   (gate_frame) and the 1.5 m inner square (gate_opening) -- and the label written to disk is
   those quads CLIPPED to the photo. Corner COUNT is irrelevant: put each handle where the corner
   really is, off screen included, and the visible area comes out right. That is the whole point,
   because the pose target could not express a close gate at all (off-frame keypoints are stored
   clamped with v=0, so anything reading them back has to refit a homography, which needs >= 4
   corners in frame -- blocked on 52.9% of ticks inside 2 m).

   CONVENTIONS (frozen -- must match tools/gate_labeler/labelio.py + blender_gen/contract.py):
     * keypoints 0-3 = INNER LL,LR,UR,UL ; 4-7 = OUTER LL,LR,UR,UL (gate frame Y-DOWN)
     * the labeler clicks the 4 INNER corners in guided order LL -> LR -> UR -> UL
     * outer corners are DERIVED via the 4-point plane homography (canonical inner square,
       metres, Y-down -> clicked pixels), then applied to the canonical outer square -- drag any
       of them to override, which marks it "detached" and measured
     * encoding/normalization happens SERVER-side in labelio.py (single source of truth); this
       page's clip/area code is a PREVIEW and is cross-checked against the server on every save
   ========================================================================================== */

// ---- gate-plane geometry (mirror of labelio.INNER_PLANE / OUTER_PLANE) -------------------
const HI = 0.75;                       // GATE_INNER_SIZE_M / 2  (1.5 / 2)
const HO = 1.36;                       // GATE_OUTER_SIZE_M / 2  (2.72 / 2)
const IN_PLANE  = [[-HI,+HI],[+HI,+HI],[+HI,-HI],[-HI,-HI]];   // LL,LR,UR,UL  Y-DOWN
const OUT_PLANE = [[-HO,+HO],[+HO,+HO],[+HO,-HO],[-HO,-HO]];
const CORNER = ["LL","LR","UR","UL"];
const GATE_COLORS = ["#00e5ff","#ffd54f","#7cff6b","#ff8ad8","#a390ff","#ff9d5c"];

// ---- 4-point homography (DLT, 8x8 gaussian elimination w/ partial pivoting) --------------
function gaussSolve(A, b) {
  const n = b.length, M = A.map((row, i) => row.concat([b[i]]));
  for (let c = 0; c < n; c++) {
    let piv = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    if (Math.abs(M[piv][c]) < 1e-12) throw new Error("degenerate corners");
    [M[c], M[piv]] = [M[piv], M[c]];
    for (let r = c + 1; r < n; r++) {
      const f = M[r][c] / M[c][c];
      for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
    }
  }
  const x = new Array(n).fill(0);
  for (let r = n - 1; r >= 0; r--) {
    let s = M[r][n];
    for (let k = r + 1; k < n; k++) s -= M[r][k] * x[k];
    x[r] = s / M[r][r];
  }
  return x;
}
function solveH(IN, P) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [X, Y] = IN[i], [u, v] = P[i];
    A.push([X, Y, 1, 0, 0, 0, -u*X, -u*Y]); b.push(u);
    A.push([0, 0, 0, X, Y, 1, -v*X, -v*Y]); b.push(v);
  }
  const h = gaussSolve(A, b);
  return [[h[0],h[1],h[2]],[h[3],h[4],h[5]],[h[6],h[7],1]];
}
function applyH(H, X, Y) {
  const w = H[2][0]*X + H[2][1]*Y + H[2][2];
  return [(H[0][0]*X + H[0][1]*Y + H[0][2]) / w,
          (H[1][0]*X + H[1][1]*Y + H[1][2]) / w];
}
// Horizon guard -- MUST match labelio._W_EPS / _SANE_SPAN / derive_outer_from_inner.
// The outer square is 1.813x the inner, so deriving it EXTRAPOLATES. Under extreme perspective
// that can reach the gate plane's VANISHING LINE: w -> 0 (point at infinity), then w < 0 and the
// point WRAPS to the opposite side of the image. No valid pixel exists for such a corner (the real
// gate frame there is behind the camera plane). Unguarded, a wrapped corner can land back inside
// the frame and be stored v=2 at a meaningless position. We push it well outside the border
// instead, so it encodes v=0 (off-frame, masked by the pose loss) and renders hollow.
const W_EPS = 0.08, SANE_SPAN = 4.0;
function outerValidity(innerPx, W, Hh) {
  const H = solveH(IN_PLANE, innerPx);
  return OUT_PLANE.map(([X, Y]) => {
    const w = H[2][0]*X + H[2][1]*Y + H[2][2];
    if (w <= W_EPS) return false;
    const x = (H[0][0]*X + H[0][1]*Y + H[0][2]) / w, y = (H[1][0]*X + H[1][1]*Y + H[1][2]) / w;
    return Math.abs(x) <= SANE_SPAN * W && Math.abs(y) <= SANE_SPAN * Hh;
  });
}
function outerFromInner(innerPx) {
  const W = (img && img.naturalWidth) || 640, Hh = (img && img.naturalHeight) || 360;
  const H = solveH(IN_PLANE, innerPx);
  const valid = outerValidity(innerPx, W, Hh);
  const cx = innerPx.reduce((a, p) => a + p[0], 0) / 4;
  const cy = innerPx.reduce((a, p) => a + p[1], 0) / 4;
  const span = 1.5 * Math.max(W, Hh);
  lastOuterValid = valid;
  return OUT_PLANE.map(([X, Y], i) => {
    if (valid[i]) return applyH(H, X, Y);
    const dx = innerPx[i][0] - cx, dy = innerPx[i][1] - cy;
    const n = Math.hypot(dx, dy) || 1;
    return [cx + dx / n * span, cy + dy / n * span];
  });
}
let lastOuterValid = [true, true, true, true];

// ---- state --------------------------------------------------------------------------------
// gate = { inner:[[x,y]..<=4], outer:[[x,y]x4]|null, occ:[bool x8], detached:[bool x4] }
//   * inner grows during guided clicking; when it reaches 4, outer is auto-derived
//   * detached[i]: user hand-dragged outer corner i -> inner-drag no longer recomputes it
//   * occ[k]: labeler marked keypoint k occluded-but-in-frame (v=1); off-frame (v=0) is
//     AUTOMATIC from position -- labelio computes it at save time
let frames = [], frameIdx = -1;
let img = new Image(), imgReady = false;
let gates = [], selGate = -1, selPoint = -1;   // selPoint: 0-3 inner, 4-7 outer
let isSeed = false;                            // gates came from an UNVERIFIED detector seed
let fromGeom = false;                          // handles restored EXACTLY (sidecar), not clamped
let seedInfo = null;                           // the seeder's self-check: {source, iou, kpts_in_frame}
let lastSaved = null;                          // what the server actually wrote, for the status bar
let segMismatch = "";                          // preview vs server area disagreement (should be "")
let collecting = false;                        // guided-click mode for the LAST gate
let dirty = false;
let view = { s: 1, tx: 0, ty: 0 };             // screen = img*s + t
let drag = null;                               // {kind:'pan'|'point', ...}
let spaceHeld = false;

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);

// ---- helpers ------------------------------------------------------------------------------
const toScreen = p => [p[0]*view.s + view.tx, p[1]*view.s + view.ty];
const toImg = (x, y) => [(x - view.tx)/view.s, (y - view.ty)/view.s];
const curGate = () => (selGate >= 0 && selGate < gates.length) ? gates[selGate] : null;
const gateComplete = g => g.inner.length === 4 && g.outer;
const inFrame = p => p[0] >= 0 && p[0] <= img.naturalWidth - 1 &&
                     p[1] >= 0 && p[1] <= img.naturalHeight - 1;
function setDirty(v) { dirty = v; $("dirty").textContent = v ? "UNSAVED" : ""; }
function newGate() {
  return { inner: [], outer: null, occ: new Array(8).fill(false),
           detached: new Array(4).fill(false) };
}
function recomputeOuter(g, force) {
  if (g.inner.length !== 4) return;
  const o = outerFromInner(g.inner);
  if (!g.outer) g.outer = o;
  else for (let i = 0; i < 4; i++) if (force || !g.detached[i]) g.outer[i] = o[i];
  if (force) g.detached.fill(false);
}

// ---- server io ----------------------------------------------------------------------------
async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function refreshFrames() {
  const j = await api("/api/frames");
  frames = j.frames;
  renderSidebar();
}
async function loadFrame(i) {
  if (i < 0 || i >= frames.length) return;
  if (dirty && !confirm("Unsaved changes on this frame - discard?")) return;
  frameIdx = i; imgReady = false;
  gates = []; selGate = -1; selPoint = -1; collecting = false; setDirty(false);
  lastSaved = null; segMismatch = ""; fromGeom = false;
  const name = frames[i].name;
  img = new Image();
  img.onload = async () => {
    imgReady = true;
    fitView();
    try {
      const j = await api("/api/label?name=" + encodeURIComponent(name));
      isSeed = false; fromGeom = !!j.geom; seedInfo = j.seed_info || null;
      if (j.exists || j.seed) {
        // resume (human label) OR seed (detector pre-label): rebuild gates from the decoded
        // rows; outer marked detached so a stray inner nudge won't clobber them. For a SEED the
        // outer corners came DIRECTLY from the 8-keypoint model -- never re-derive them from the
        // inner square, since that homography extrapolation is what seeding exists to avoid.
        gates = j.gates.map(g => ({
          inner: g.inner.map(p => p.slice()), outer: g.outer.map(p => p.slice()),
          occ: g.vis.map(v => v === 1),
          // From the sidecar, ``detached`` is the truth we stored. From a pose row (or a seed) the
          // outer corners are clamped-or-model output, so treat them as hand-placed: re-deriving
          // them would overwrite the only positions we have.
          detached: g.outer_detached ? g.outer_detached.slice() : new Array(4).fill(true),
        }));
        selGate = gates.length - 1;
        isSeed = !!j.seed;   // unverified: frame stays UNLABELED until the human saves
      } else if (!frames[i].labeled) {
        startGate();  // fresh frame: auto-arm guided clicking for gate 0
      }
    } catch (e) { console.error(e); }
    draw(); renderSidebar(); updateStatus();
  };
  img.src = "/frames/" + encodeURIComponent(name) + "?t=" + Date.now();
  renderSidebar(); updateStatus();
}
async function save(asNegative) {
  if (frameIdx < 0 || !imgReady) return;
  if (asNegative) { gates = []; selGate = -1; collecting = false; }
  const done = gates.filter(gateComplete);
  if (!asNegative && done.length !== gates.length) {
    alert("A gate has fewer than 4 inner corners - finish or delete it first."); return;
  }
  const payload = {
    name: frames[frameIdx].name,
    img_w: img.naturalWidth, img_h: img.naturalHeight,
    gates: done.map(g => ({ inner: g.inner, outer: g.outer, occluded: g.occ,
                            outer_detached: g.detached })),
  };
  try {
    const j = await api("/api/save", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    if (j.warning) alert("Saved, but: " + j.warning);
    // The SERVER's areas are what got written. Report them, and cross-check against this page's
    // preview -- the clip runs in both places, and a divergence would otherwise show up only as a
    // model that trained on shapes nobody ever looked at.
    lastSaved = { rows: j.rows, seg_rows: j.seg_rows, seg: j.seg || [] };
    segMismatch = "";
    (j.seg || []).forEach((rep, i) => {
      const mine = segStatus(done[i]);
      for (const [k, got] of [["gate_frame", mine.frame], ["gate_opening", mine.opening]]) {
        const srv = (rep[k] && rep[k].area) || 0;
        if (Math.abs(srv - got) > 0.02 * Math.max(srv, got, 1))
          segMismatch = `preview/server area mismatch on gate ${i + 1} ${k}: ` +
                        `${fmtArea(got)} vs ${fmtArea(srv)}`;
      }
    });
    if (segMismatch) console.warn(segMismatch);
    if (!asNegative && done.length && !j.seg_rows)
      alert("Saved, but NO AREA was written for any gate - check the badges before moving on.");
    frames[frameIdx].labeled = true;
    frames[frameIdx].seeded = false;   // human-approved now; the seed no longer applies
    isSeed = false;
    setDirty(false); renderSidebar(); updateStatus(); draw();
  } catch (e) { alert("save failed: " + e.message); }
}

// ---- gate editing -------------------------------------------------------------------------
function startGate() {
  if (collecting) return;
  gates.push(newGate());
  selGate = gates.length - 1; selPoint = -1; collecting = true;
  updateStatus(); draw();
}
function deleteGate() {
  if (selGate < 0) return;
  gates.splice(selGate, 1);
  collecting = false;
  selGate = gates.length - 1; selPoint = -1;
  setDirty(true); updateStatus(); draw();
}
function addClick(px) {
  const g = gates[gates.length - 1];
  g.inner.push(px);
  if (g.inner.length === 4) {
    recomputeOuter(g, true);   // derive outer via homography
    collecting = false;
  }
  setDirty(true); updateStatus(); draw();
}
function undoClick() {
  if (!collecting) return;
  const g = gates[gates.length - 1];
  if (g.inner.length > 0) g.inner.pop();
  else { gates.pop(); collecting = false; selGate = gates.length - 1; }
  setDirty(true); updateStatus(); draw();
}
function hitTest(sx, sy) {   // nearest keypoint within 10 screen px -> {gi, pi}
  let best = null, bestD = 10;
  gates.forEach((g, gi) => {
    const pts = g.inner.concat(g.outer || []);
    pts.forEach((p, pi) => {
      const [x, y] = toScreen(p), d = Math.hypot(x - sx, y - sy);
      if (d < bestD) { bestD = d; best = { gi, pi }; }
    });
  });
  return best;
}

// ---- view / canvas ------------------------------------------------------------------------
// The canvas backing store must track #canvaswrap, and the wrap changes height for reasons that
// are NOT window resizes -- the status bar reflowing was one. When it did, the backing store kept
// its old size, CSS squashed it into the shorter box, and the bottom ~19 px stopped being repainted
// while lines kept streaking across it. So: re-sync on every draw (it is a cheap compare) AND
// observe the element, rather than trusting the window resize event.
function syncCanvasSize() {
  const r = $("canvaswrap").getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width === w && cv.height === h) return false;
  cv.width = w; cv.height = h;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // setting width/height resets the transform
  return true;
}
function canvasSize() {                     // painted extent in CSS px -- the truth, not the rect
  const dpr = window.devicePixelRatio || 1;
  return [cv.width / dpr, cv.height / dpr];
}
function resizeCanvas() { syncCanvasSize(); draw(); }
// Leave WORKING ROOM around the photo. A close gate's corners are off screen and must be clicked
// out there, so the default view can't be the image edge-to-edge -- 0.96 left nowhere to put them.
const FIT_MARGIN = 0.62;

function fitView() {
  if (!imgReady) return;
  syncCanvasSize();
  const [cw, ch] = canvasSize();
  view.s = Math.min(cw / img.naturalWidth, ch / img.naturalHeight) * FIT_MARGIN;
  view.tx = (cw - img.naturalWidth * view.s) / 2;
  view.ty = (ch - img.naturalHeight * view.s) / 2;
  draw();
}
function draw() {
  syncCanvasSize();
  const [cw, ch] = canvasSize();
  ctx.clearRect(0, 0, cw, ch);
  if (!imgReady) return;
  ctx.fillStyle = "#0b0d10";                // the OUTSIDE: clicks land here and that is fine
  ctx.fillRect(0, 0, cw, ch);
  ctx.save();
  ctx.translate(view.tx, view.ty); ctx.scale(view.s, view.s);
  ctx.imageSmoothingEnabled = view.s < 2;   // crisp pixels when zoomed for precise clicking
  ctx.drawImage(img, 0, 0);
  ctx.restore();
  // The image border is the CLIP boundary now -- everything outside it is cut from the label --
  // so draw it as a real edge rather than a faint hint.
  const [bx, by] = toScreen([0, 0]);
  ctx.strokeStyle = "#7d8794"; ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, img.naturalWidth * view.s, img.naturalHeight * view.s);

  if (showSeg) gates.forEach(g => drawSegPreview(g));
  if (showGuides && curGate()) drawGuides(curGate(), GATE_COLORS[selGate % GATE_COLORS.length]);
  gates.forEach((g, gi) => drawGate(g, gi));
}

// --- THE AREA IS THE LABEL (2026-07-22) ----------------------------------------------------
// The line/segmentation path trains on a two-class AREA target -- gate_frame (the 2.72 m outer
// square) and gate_opening (the 1.5 m inner square) -- and the server now writes those polygons
// straight from the quads as drawn, CLIPPED to the frame (labelio.encode_seg_label). Nothing is
// reconstructed from the pose row, so there is no ">= 4 corners in frame" rule any more: place the
// four handles wherever the corners really are, off screen included, and the visible area is the
// label. On by default, because it IS the thing being labelled -- press 'm' to see the photo alone.
let showSeg = true;
let showGuides = true;    // extended edge lines: how you aim a handle you cannot see

const MIN_AREA_PX = 64;   // mirrors seg_labels.MIN_VISIBLE_AREA_PX

function polyArea(pts) {
  if (pts.length < 3) return 0;
  let a = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return Math.abs(a) / 2;
}
function fmtArea(a) {
  return a >= 10000 ? (a / 1000).toFixed(0) + "k" : a >= 1000 ? (a / 1000).toFixed(1) + "k"
                                                              : a.toFixed(0);
}
// Mirror of labelio.quad_is_simple: a projected square is convex, so a bow-tie means the corners
// were clicked out of order and its shoelace "area" is meaningless. Refused, not silently written.
function quadIsSimple(q) {
  if (!q || q.length !== 4) return false;
  let pos = 0, neg = 0;
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) % 4], c = q[(i + 2) % 4];
    const ax = b[0] - a[0], ay = b[1] - a[1], bx = c[0] - b[0], by = c[1] - b[1];
    const cross = ax * by - ay * bx;
    const scale = Math.max(Math.abs(ax) + Math.abs(ay), 1) * Math.max(Math.abs(bx) + Math.abs(by), 1);
    if (cross > 1e-9 * scale) pos++; else if (cross < -1e-9 * scale) neg++;
  }
  return pos === 0 || neg === 0 || pos === 1 || neg === 1;
}

function clipToFrame(pts) {                      // Sutherland-Hodgman, mirrors seg_labels.clip_polygon
  const W = img.naturalWidth - 1, H = img.naturalHeight - 1;
  const edges = [
    [p => p[0] >= 0, (a, b) => lerp(a, b, (0 - a[0]) / (b[0] - a[0]))],
    [p => p[0] <= W, (a, b) => lerp(a, b, (W - a[0]) / (b[0] - a[0]))],
    [p => p[1] >= 0, (a, b) => lerp(a, b, (0 - a[1]) / (b[1] - a[1]))],
    [p => p[1] <= H, (a, b) => lerp(a, b, (H - a[1]) / (b[1] - a[1]))],
  ];
  let out = pts.slice();
  for (const [inside, cut] of edges) {
    const src = out; out = [];
    for (let i = 0; i < src.length; i++) {
      const cur = src[i], prv = src[(i - 1 + src.length) % src.length];
      const ci = inside(cur), pi = inside(prv);
      if (ci) { if (!pi) out.push(cut(prv, cur)); out.push(cur); }
      else if (pi) out.push(cut(prv, cur));
    }
    if (!out.length) return [];
  }
  return out;
}
function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }

function fillPoly(pts, fill) {
  if (pts.length < 3) return;
  ctx.beginPath();
  pts.forEach((p, i) => { const [x, y] = toScreen(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}

function drawSegPreview(g) {
  if (!gateComplete(g) || !g.outer) return;
  const st = segStatus(g);
  // Shade only what will actually be WRITTEN. A suppressed class (past-horizon / bow-tie) must not
  // paint, or the preview would promise a mask the label file does not contain.
  if (st.frame >= MIN_AREA_PX) fillPoly(clipToFrame(g.outer), "rgba(255,140,0,0.28)");   // class 0
  if (st.opening >= MIN_AREA_PX) fillPoly(clipToFrame(g.inner), "rgba(0,220,80,0.30)");  // class 1
}

// --- WILL THIS GATE ACTUALLY BECOME A LABEL? ----------------------------------------------
// Mirror of labelio.seg_rows_for_gate -- ONLY the visible area decides. What used to gate a label
// (">= 4 keypoints in frame, >= 2 per diagonal", the homography-refit rule) is gone: the polygon is
// taken as drawn, so corner COUNT is irrelevant and a gate with nothing in frame still labels.
// Two things can still kill a class, and both are real geometry errors rather than crops:
//   * PAST HORIZON -- the outer square is extrapolated 1.813x from the inner clicks, and under
//     extreme perspective that reaches the gate plane's vanishing line, where no pixel exists. The
//     placeholder corner used there is fine for a v=0 keypoint and is NOT a polygon vertex. Drag
//     the outer corners onto the real edge (they detach, and a measured corner is always trusted).
//   * SELF-INTERSECTING -- corners clicked out of order.
function drawSegBadge(g, gi) {
  const st = segStatus(g);
  if (st.why === "incomplete") return;
  // Anchor on the CLIPPED area, which is on screen by construction. Anchoring on a corner put the
  // badge off canvas exactly in the close-range case this whole mode exists for.
  const poly = st.opening >= MIN_AREA_PX ? clipToFrame(g.inner)
             : st.frame >= MIN_AREA_PX ? clipToFrame(g.outer) : clipToFrame(g.inner);
  const src = poly.length ? poly : [[img.naturalWidth / 2, img.naturalHeight / 2]];
  const anchor = src.reduce((a, p) => [a[0] + p[0] / src.length, a[1] + p[1] / src.length], [0, 0]);
  const [x, y] = toScreen(anchor);
  const txt = (st.ok ? "AREA OK  " : "NO AREA  ") + st.why;
  ctx.font = "bold 12px sans-serif";
  const w = ctx.measureText(txt).width + 10;
  ctx.fillStyle = st.ok ? "rgba(16,72,32,0.88)" : "rgba(120,20,20,0.92)";
  ctx.fillRect(x - w / 2, y - 9, w, 18);
  ctx.fillStyle = st.ok ? "#7ef0a0" : "#ffb3b3";
  ctx.textAlign = "center";
  ctx.fillText(txt, x, y + 4);
  ctx.textAlign = "left";
}

function segStatus(g) {
  const st = { ok: false, why: "incomplete", frame: 0, opening: 0, n: 0, notes: [] };
  if (!gateComplete(g) || !g.outer) return st;
  const W = img.naturalWidth, H = img.naturalHeight;
  if (quadIsSimple(g.inner)) st.opening = polyArea(clipToFrame(g.inner));
  else st.notes.push("opening self-intersecting");

  let valid = [true, true, true, true];
  try { valid = outerValidity(g.inner, W, H); } catch (e) { valid = [false, false, false, false]; }
  const trusted = valid.every((v, i) => v || g.detached[i]);
  if (!trusted) st.notes.push("frame past horizon – drag its corners");
  else if (!quadIsSimple(g.outer)) st.notes.push("frame self-intersecting");
  else st.frame = polyArea(clipToFrame(g.outer));

  st.n = (st.frame >= MIN_AREA_PX ? 1 : 0) + (st.opening >= MIN_AREA_PX ? 1 : 0);
  st.ok = st.n > 0;
  const sizes = `frame ${fmtArea(st.frame)} · opening ${fmtArea(st.opening)} px²`;
  st.why = st.ok ? (st.notes.length ? sizes + " · " + st.notes.join(", ") : sizes)
                 : (st.notes.length ? st.notes.join(", ") : "nothing visible in frame");
  return st;
}

// The INFINITE line through a,b clipped to the canvas (Liang-Barsky). Corners you are placing are
// usually off screen; the gate EDGE they define is not, so these guides are how you aim.
function clipLineToRect(a, b, w, h) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  if (Math.abs(dx) < 1e-9 && Math.abs(dy) < 1e-9) return null;
  let t0 = -1e9, t1 = 1e9;
  const clip = (p, q) => {
    if (Math.abs(p) < 1e-12) return q >= 0;
    const t = q / p;
    if (p < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
    else { if (t < t0) return false; if (t < t1) t1 = t; }
    return true;
  };
  if (!clip(-dx, a[0]) || !clip(dx, w - a[0]) || !clip(-dy, a[1]) || !clip(dy, h - a[1])) return null;
  return [[a[0] + t0 * dx, a[1] + t0 * dy], [a[0] + t1 * dx, a[1] + t1 * dy]];
}
function drawGuides(g, color) {
  if (!gateComplete(g)) return;
  const [cw, ch] = canvasSize();
  ctx.save(); ctx.setLineDash([2, 6]); ctx.lineWidth = 1; ctx.globalAlpha = 0.5;
  ctx.strokeStyle = color;
  for (const quad of [g.inner, g.outer]) {
    for (let i = 0; i < 4; i++) {
      const seg = clipLineToRect(toScreen(quad[i]), toScreen(quad[(i + 1) % 4]), cw, ch);
      if (!seg) continue;
      ctx.beginPath(); ctx.moveTo(seg[0][0], seg[0][1]); ctx.lineTo(seg[1][0], seg[1][1]); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawPoly(pts, color, dashed) {
  ctx.beginPath();
  pts.forEach((p, i) => { const [x, y] = toScreen(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath();
  ctx.setLineDash(dashed ? [6, 4] : []);
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
}
function drawGate(g, gi) {
  const color = GATE_COLORS[gi % GATE_COLORS.length];
  if (g.inner.length >= 2) drawPoly(g.inner, color, false);          // inner: solid
  if (g.outer) drawPoly(g.outer, color, true);                       // outer: dashed
  drawSegBadge(g, gi);
  const pts = g.inner.concat(g.outer || []);
  pts.forEach((p, pi) => {
    const [x, y] = toScreen(p);
    const isSel = gi === selGate && pi === selPoint;
    const off = !inFrame(p);                                         // v=0 at save time
    ctx.beginPath(); ctx.arc(x, y, isSel ? 6 : 4.5, 0, 7);
    if (off)             { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(); }   // hollow
    else if (g.occ[pi])  { ctx.fillStyle = "#ff8c42"; ctx.fill(); }                      // occluded
    else                 { ctx.fillStyle = color; ctx.fill(); }                          // visible
    if (isSel) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke(); }
    ctx.fillStyle = color; ctx.font = "11px sans-serif";
    ctx.fillText((pi < 4 ? "i" : "o") + CORNER[pi % 4], x + 7, y - 6);
  });
}

// ---- status / sidebar ---------------------------------------------------------------------
function updateStatus() {
  const p = $("prompt");
  if (collecting) {
    const g = gates[gates.length - 1], k = g.inner.length;
    p.textContent = `Gate ${gates.length}: click INNER ${CORNER[k]}  (${k + 1}/4)`
                  + "  —  OUTSIDE the photo is fine";
    p.classList.remove("done");
  } else if (isSeed) {
    // Loud on purpose: these points are machine output, not a label. Nothing is recorded until
    // the human presses save -- the frame is still counted as UNLABELED. The seeder's own
    // self-check rides along so a weak seed announces itself instead of looking authoritative.
    if (seedInfo && seedInfo.reasons) {
      // A label the audit could not trust, handed back for a second look. Say WHY, or the human
      // has to re-derive the doubt themselves.
      p.textContent = `RE-REVIEW your earlier label — ${seedInfo.reasons.join(", ")}`
                    + `  (fix the AREA, then SAVE to re-approve)`;
    } else {
      const s = seedInfo
        ? ` [${seedInfo.source}, ring ${seedInfo.ring}, ${seedInfo.kpts_in_frame}/8 corners in frame]`
        : "";
      p.textContent = `SEEDED (UNVERIFIED)${s} - ${gates.length} gate(s): fix the AREA, then SAVE`;
    }
    p.classList.remove("done");
  } else {
    p.textContent = gates.length
      ? `${gates.length} gate(s) - drag points to adjust`
      : "no gates (use + add gate, or NO GATE for a negative)";
    p.classList.add("done");
  }
  $("frameinfo").textContent = frameIdx >= 0
    ? `frame ${frameIdx + 1}/${frames.length} - ${frames[frameIdx].name}` : "";
  // Live AREA readout: this, not the corner count, is what decides whether the frame trains.
  const live = gates.filter(gateComplete).map(segStatus);
  const nMask = live.reduce((a, s) => a + s.n, 0);
  let txt = live.length
    ? `${nMask} mask(s): ` + live.map((s, i) => `g${i + 1} ${fmtArea(s.frame)}/${fmtArea(s.opening)}`).join(" ")
    : "";
  if (lastSaved) txt += ` · saved ${lastSaved.seg_rows}`;
  if (fromGeom) txt += " · exact";
  else if (frameIdx >= 0 && frames[frameIdx] && frames[frameIdx].labeled && !isSeed)
    txt += " · ⚠ clamped legacy label";
  if (segMismatch) txt += " · ⚠ " + segMismatch;
  const el = $("areainfo");
  el.textContent = txt;
  el.title = txt;                            // the bar ellipsizes; hover for the full string
}
// A pooled batch is mostly frames with NO pre-fill, and those cost four clicks each instead of a
// nudge. Walking all 1598 in order would spend the evening on the expensive ones, so prev/next and
// the list both move through the FILTERED set by default.
let onlyReady = true;
function visible() {
  return frames.map((f, i) => i).filter(i => !onlyReady || frames[i].seeded || frames[i].labeled);
}
function step(dir) {
  const v = visible();
  if (!v.length) return;
  const at = v.indexOf(frameIdx);
  if (at < 0) return loadFrame(v[dir > 0 ? 0 : v.length - 1]);
  const j = at + dir;
  if (j >= 0 && j < v.length) loadFrame(v[j]);
}
function renderSidebar() {
  const n = frames.filter(f => f.labeled).length;
  const v = visible();
  const todo = v.filter(i => !frames[i].labeled).length;
  $("progress").textContent = `labeled ${n} / ${frames.length}` +
    (onlyReady ? `  ·  ${todo} pre-filled left` : "");
  const list = $("framelist"); list.innerHTML = "";
  const shown = new Set(v);
  frames.forEach((f, i) => {
    if (!shown.has(i)) return;
    const d = document.createElement("div");
    // Seeded vs not is the difference between a nudge and clicking four corners from scratch, so
    // it belongs in the list -- it is how you decide what to work on next.
    d.className = "fitem" + (f.labeled ? " done" : f.seeded ? " seeded" : "")
                + (i === frameIdx ? " cur" : "");
    d.textContent = f.name; d.title = f.name;
    d.onclick = () => loadFrame(i);
    list.appendChild(d);
  });
  const cur = list.querySelector(".fitem.cur");   // NOT children[frameIdx]: the list is filtered
  if (cur) cur.scrollIntoView({ block: "nearest" });
}

// ---- mouse --------------------------------------------------------------------------------
cv.addEventListener("mousedown", e => {
  const rect = cv.getBoundingClientRect(), sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  if (e.button === 1 || e.button === 2 || spaceHeld) {          // pan
    drag = { kind: "pan", x: sx, y: sy }; e.preventDefault(); return;
  }
  if (e.button !== 0 || !imgReady) return;
  const hit = hitTest(sx, sy);
  if (hit) {                                                    // grab a point to drag
    selGate = hit.gi; selPoint = hit.pi;
    drag = { kind: "point", gi: hit.gi, pi: hit.pi, moved: false };
    updateStatus(); draw(); return;
  }
  if (collecting) addClick(toImg(sx, sy));                      // guided inner click
  else { selPoint = -1; draw(); }
});
cv.addEventListener("mousemove", e => {
  if (!drag) return;
  const rect = cv.getBoundingClientRect(), sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  if (drag.kind === "pan") {
    view.tx += sx - drag.x; view.ty += sy - drag.y;
    drag.x = sx; drag.y = sy; draw(); return;
  }
  const g = gates[drag.gi], p = toImg(sx, sy);
  drag.moved = true;
  if (drag.pi < 4) {                       // inner drag: recompute non-detached outer live
    g.inner[drag.pi] = p;
    if (gateComplete(g)) recomputeOuter(g, false);
  } else {                                 // outer drag: independent nudge -> detach
    g.outer[drag.pi - 4] = p;
    g.detached[drag.pi - 4] = true;
  }
  setDirty(true); draw(); updateStatus();      // the area readout must track the handle live
});
window.addEventListener("mouseup", () => { drag = null; });
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("wheel", e => {
  e.preventDefault();
  if (!imgReady) return;
  const rect = cv.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const k = Math.pow(1.0015, -e.deltaY);
  const s2 = Math.min(60, Math.max(0.05, view.s * k)), kk = s2 / view.s;
  view.tx = mx - (mx - view.tx) * kk; view.ty = my - (my - view.ty) * kk; view.s = s2;
  draw();
}, { passive: false });

// ---- keyboard -----------------------------------------------------------------------------
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { spaceHeld = true; cv.style.cursor = "grab"; e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "s") { e.preventDefault(); save(false); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  switch (k) {
    case "arrowright": case "d": step(1); break;
    case "arrowleft":  case "a": step(-1); break;
    case "s": save(false); break;
    case "k": setDirty(false); step(1); break;                              // skip
    case "n": save(true); break;                                            // negative
    case "g": startGate(); break;
    case "x": case "delete": deleteGate(); break;
    case "r": { const g = curGate(); if (g && gateComplete(g)) { recomputeOuter(g, true); setDirty(true); draw(); } break; }
    case "o": { const g = curGate();                                        // toggle occluded
      if (g && selPoint >= 0) { g.occ[selPoint] = !g.occ[selPoint]; setDirty(true); draw(); } break; }
    case "m": showSeg = !showSeg; draw(); break;                            // area shading
    case "l": showGuides = !showGuides; draw(); break;                      // extended edge lines
    case "z": case "backspace": undoClick(); break;
    case "0": fitView(); break;
    case "escape":
      if (collecting) undoClickAll();
      else { selPoint = -1; draw(); }
      break;
  }
});
window.addEventListener("keyup", e => {
  if (e.code === "Space") { spaceHeld = false; cv.style.cursor = "crosshair"; }
});
function undoClickAll() {   // Esc during collection: drop the in-progress gate entirely
  gates.pop(); collecting = false; selGate = gates.length - 1;
  updateStatus(); draw();
}

// ---- buttons ------------------------------------------------------------------------------
$("bPrev").onclick = () => step(-1);
$("bNext").onclick = () => step(1);
$("bSave").onclick = () => save(false);
$("bSkip").onclick = () => { setDirty(false); step(1); };
$("bNoGate").onclick = () => save(true);
$("bAddGate").onclick = startGate;
$("bDelGate").onclick = deleteGate;
$("bRecompute").onclick = () => { const g = curGate();
  if (g && gateComplete(g)) { recomputeOuter(g, true); setDirty(true); draw(); } };
$("bFit").onclick = fitView;
$("cOnlyReady").onchange = e => { onlyReady = e.target.checked; renderSidebar(); };
window.addEventListener("resize", resizeCanvas);
// ...and catch layout changes the window never hears about (status/toolbar reflow, zoom, devtools)
if (window.ResizeObserver) new ResizeObserver(() => resizeCanvas()).observe($("canvaswrap"));

// ---- boot ---------------------------------------------------------------------------------
(async () => {
  resizeCanvas();
  await refreshFrames();
  // resume at the first PRE-FILLED unlabeled frame: cheapest work first
  const v = visible();
  const first = v.find(i => !frames[i].labeled);
  if (frames.length) loadFrame(first !== undefined ? first : (v[0] !== undefined ? v[0] : 0));
})();
</script>
</body>
</html>
